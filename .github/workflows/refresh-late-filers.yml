name: Refresh SEC Late Filers report

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (6-7 AM Eastern)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-late-filers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull EDGAR data
        run: python sec/late-filers/refresh.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sec/late-filers/data.json
          git diff --cached --quiet || git commit -m "Refresh SEC Late Filers data"
          git push
