<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Quadrant Hex Reconstructor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            padding: 20px;
            background: #f0f8ff;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .quadrant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .quadrant-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #fafafa;
        }
        .quadrant-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .hex-list {
            max-height: 200px;
            overflow-y: auto;
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .hex-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
        }
        .hex-swatch {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        .reconstruction-hints {
            margin-top: 40px;
            padding: 30px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
        }
        .reconstruction-hints h2 {
            color: #856404;
            margin-bottom: 20px;
        }
        .hint-item {
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 4px;
        }
        .hint-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .hint-desc {
            color: #666;
            font-size: 14px;
        }
        #downloadBtn {
            background: #28a745;
        }
        #downloadBtn:hover {
            background: #218838;
        }
        .hex-checkbox {
            margin-right: 8px;
            cursor: pointer;
        }
        #canvasSection {
            margin-top: 40px;
            padding: 30px;
            background: #111;
            border-radius: 8px;
            text-align: center;
        }
        #canvasContainer {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        #canvas {
            border: 3px solid #0f0;
        }
        #gridCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        #reconstructBtn {
            background: #ff6b6b;
            font-size: 18px;
            padding: 15px 40px;
        }
        #reconstructBtn:hover {
            background: #ff5252;
        }
        .select-all-btn {
            background: #6c757d;
            font-size: 12px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Quadrant Hex Reconstructor</h1>
        
        <div class="upload-section">
            <p><strong>Upload CSV from face-tool</strong></p>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Expected format: x,y,gridX,gridY,distance_from_center,quadrant,hex</p>
            <input type="file" id="csvFile" accept=".csv">
            <button onclick="analyzeCSV()">Analyze Quadrants</button>
            <button id="downloadBtn" onclick="downloadReport()" style="display:none;">Download Report</button>
        </div>

        <div id="stats" class="stats"></div>
        
        <div id="globalHexSelector" style="display:none; margin: 30px 0; padding: 20px; background: #fff3cd; border-radius: 8px; border-left: 4px solid #ffc107;">
            <h2 style="color: #856404; margin-bottom: 15px;">🎨 Global Color Selection (Top 30)</h2>
            <p style="color: #856404; margin-bottom: 15px;">Select/deselect colors here to apply across ALL quadrants</p>
            <div style="margin-bottom: 15px;">
                <button class="select-all-btn" onclick="selectAllGlobal()">Select All</button>
                <button class="select-all-btn" onclick="deselectAllGlobal()">Deselect All</button>
                <button class="select-all-btn" onclick="selectDarkOnly()">Dark Colors Only</button>
                <button class="select-all-btn" onclick="selectLightOnly()">Light Colors Only</button>
            </div>
            <div id="globalHexList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px;"></div>
        </div>

        <div id="quadrantReport" class="quadrant-grid"></div>
        <div id="reconstructionHints" class="reconstruction-hints" style="display:none;"></div>
    </div>

    <div id="canvasSection" style="display:none;">
        <h2 style="color: #0f0; margin-bottom: 20px;">🎯 Selective Reconstruction</h2>
        <button id="reconstructBtn" onclick="reconstructSelected()">🎨 Reconstruct Selected Colors</button>
        <button id="exportSVGBtn" onclick="exportToSVG()" style="display:none; background: #FFD700;">📐 Export to SVG</button>
        <div id="canvasStatus" style="color: #0f0; margin-top: 20px; font-size: 18px;"></div>
        <div id="canvasContainer">
            <canvas id="canvas"></canvas>
            <canvas id="gridCanvas"></canvas>
        </div>
    </div>

    <script>
        let analysisData = null;
        let allPixelsData = [];

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function analyzeCSV() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a CSV file');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.trim().split('\n');
                
                const quadrantMap = new Map();
                let totalPixels = 0;
                let allHexCodes = new Set();
                allPixelsData = []; // Store all pixel data for reconstruction
                
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(',');
                    if (parts.length < 7) continue;
                    
                    const x = parseInt(parts[0]);
                    const y = parseInt(parts[1]);
                    const gridX = parseInt(parts[2]);
                    const gridY = parseInt(parts[3]);
                    const distance = parseFloat(parts[4]);
                    const quadrant = parseInt(parts[5]);
                    const hex = parts[6].trim();
                    
                    // Store full pixel data
                    allPixelsData.push({ x, y, gridX, gridY, distance, quadrant, hex });
                    
                    if (!quadrantMap.has(quadrant)) {
                        quadrantMap.set(quadrant, {
                            hexCounts: new Map(),
                            totalPixels: 0
                        });
                    }
                    
                    const qData = quadrantMap.get(quadrant);
                    qData.totalPixels++;
                    qData.hexCounts.set(hex, (qData.hexCounts.get(hex) || 0) + 1);
                    allHexCodes.add(hex);
                    totalPixels++;
                }

                analysisData = {
                    totalPixels,
                    uniqueColors: allHexCodes.size,
                    quadrantMap,
                    allHexCodes
                };

                displayResults(analysisData);
                generateReconstructionHints(analysisData);
            };
            
            reader.readAsText(file);
        }

        function displayResults(data) {
            const statsDiv = document.getElementById('stats');
            const quadrantReportDiv = document.getElementById('quadrantReport');
            
            statsDiv.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">Total Pixels</div>
                    <div class="stat-value">${data.totalPixels.toLocaleString()}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Unique Colors</div>
                    <div class="stat-value">${data.uniqueColors}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Quadrants</div>
                    <div class="stat-value">${data.quadrantMap.size}</div>
                </div>
            `;

            // Calculate global hex counts (across all quadrants)
            const globalHexCounts = new Map();
            allPixelsData.forEach(p => {
                globalHexCounts.set(p.hex, (globalHexCounts.get(p.hex) || 0) + 1);
            });

            // Sort by count and get top 30
            const topHexes = Array.from(globalHexCounts.entries())
                .sort((a, b) => b[1] - a[1])
                .slice(0, 30);

            // Display global hex selector
            const globalHexList = document.getElementById('globalHexList');
            globalHexList.innerHTML = topHexes.map(([hex, count]) => {
                const rgb = hexToRgb(hex);
                const rgbStr = rgb ? `RGB(${rgb.r},${rgb.g},${rgb.b})` : '';
                const pct = ((count / data.totalPixels) * 100).toFixed(2);
                const brightness = rgb ? (rgb.r + rgb.g + rgb.b) / 3 : 128;
                const isDark = brightness < 100;
                return `
                    <div class="hex-item" style="background: white; padding: 10px; border-radius: 4px;">
                        <input type="checkbox" class="hex-checkbox global-hex-checkbox" data-hex="${hex}" data-dark="${isDark}" checked onchange="syncGlobalCheckbox('${hex}', this.checked)">
                        <div class="hex-swatch" style="background-color: ${hex}"></div>
                        <div style="flex: 1;">
                            <strong>${hex}</strong> ${rgbStr}<br>
                            <span style="color: #999;">${count.toLocaleString()} pixels (${pct}%)</span>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('globalHexSelector').style.display = 'block';

            const sortedQuadrants = Array.from(data.quadrantMap.entries())
                .sort((a, b) => a[0] - b[0]);

            let quadrantHTML = '';
            
            sortedQuadrants.forEach(([quadrant, qData]) => {
                const quadrantName = getQuadrantName(quadrant);
                const sortedHexes = Array.from(qData.hexCounts.entries())
                    .sort((a, b) => b[1] - a[1]);
                
                quadrantHTML += `
                    <div class="quadrant-card">
                        <div class="quadrant-header">
                            Quadrant ${quadrant} (${quadrantName})
                        </div>
                        <div style="margin-bottom: 10px; color: #666; font-size: 14px;">
                            ${qData.totalPixels.toLocaleString()} pixels | ${qData.hexCounts.size} unique colors
                        </div>
                        <div class="hex-list">
                            ${sortedHexes.slice(0, 20).map(([hex, count]) => {
                                const rgb = hexToRgb(hex);
                                const rgbStr = rgb ? `RGB(${rgb.r},${rgb.g},${rgb.b})` : '';
                                return `
                                    <div class="hex-item">
                                        <input type="checkbox" class="hex-checkbox" data-hex="${hex}" checked>
                                        <div class="hex-swatch" style="background-color: ${hex}"></div>
                                        <div style="flex: 1;">
                                            <strong>${hex}</strong> ${rgbStr}<br>
                                            <span style="color: #999;">${count.toLocaleString()} pixels (${((count/qData.totalPixels)*100).toFixed(1)}%)</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                            ${qData.hexCounts.size > 20 ? `<div style="margin-top: 10px; color: #999;">... and ${qData.hexCounts.size - 20} more colors</div>` : ''}
                        </div>
                    </div>
                `;
            });

            quadrantReportDiv.innerHTML = quadrantHTML;
            document.getElementById('downloadBtn').style.display = 'inline-block';
            document.getElementById('canvasSection').style.display = 'block';
        }

        function getQuadrantName(q) {
            const names = {
                0: 'Center',
                1: 'NE',
                2: 'NW',
                3: 'SW',
                4: 'SE'
            };
            return names[q] || 'Unknown';
        }

        function generateReconstructionHints(data) {
            const hintsDiv = document.getElementById('reconstructionHints');
            
            // Find quadrants with most color diversity (likely font areas)
            const diversityScores = Array.from(data.quadrantMap.entries())
                .map(([q, qData]) => ({
                    quadrant: q,
                    diversity: qData.hexCounts.size,
                    pixels: qData.totalPixels,
                    dominantColor: Array.from(qData.hexCounts.entries()).sort((a,b) => b[1] - a[1])[0]
                }))
                .sort((a, b) => b.diversity - a.diversity);

            // Find likely background color (most common across all quadrants)
            const globalColorCounts = new Map();
            data.quadrantMap.forEach(qData => {
                qData.hexCounts.forEach((count, hex) => {
                    globalColorCounts.set(hex, (globalColorCounts.get(hex) || 0) + count);
                });
            });
            const likelyBackground = Array.from(globalColorCounts.entries())
                .sort((a, b) => b[1] - a[1])[0];

            hintsDiv.style.display = 'block';
            hintsDiv.innerHTML = `
                <h2>🎯 Reconstruction Hints</h2>
                
                <div class="hint-item">
                    <div class="hint-title">Likely Background Color</div>
                    <div class="hint-desc">
                        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                            <div class="hex-swatch" style="background-color: ${likelyBackground[0]}; width: 30px; height: 30px;"></div>
                            <strong>${likelyBackground[0]}</strong> - ${likelyBackground[1].toLocaleString()} pixels (${((likelyBackground[1]/data.totalPixels)*100).toFixed(1)}%)
                        </div>
                        <p style="margin-top: 10px;">This color appears most frequently. Consider excluding it to isolate the font.</p>
                    </div>
                </div>

                <div class="hint-item">
                    <div class="hint-title">Most Diverse Quadrants (Likely Font Areas)</div>
                    <div class="hint-desc">
                        ${diversityScores.slice(0, 3).map((item, idx) => `
                            <div style="margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 4px;">
                                <strong>${idx + 1}. Quadrant ${item.quadrant} (${getQuadrantName(item.quadrant)})</strong><br>
                                ${item.diversity} unique colors | ${item.pixels.toLocaleString()} pixels<br>
                                Dominant: <span style="color: ${item.dominantColor[0]}">${item.dominantColor[0]}</span>
                            </div>
                        `).join('')}
                        <p style="margin-top: 10px;">Quadrants with more color diversity likely contain the font/text.</p>
                    </div>
                </div>

                <div class="hint-item">
                    <div class="hint-title">Reconstruction Strategy</div>
                    <div class="hint-desc">
                        <ol style="margin-left: 20px; line-height: 1.8;">
                            <li>Exclude background color (${likelyBackground[0]}) from reconstruction</li>
                            <li>Focus on quadrants ${diversityScores.slice(0, 3).map(s => s.quadrant).join(', ')} for font data</li>
                            <li>Look for dark colors (likely ink) vs light colors (likely background)</li>
                            <li>Use distance_from_center to isolate central text area</li>
                        </ol>
                    </div>
                </div>
            `;
        }

        function downloadReport() {
            if (!analysisData) return;

            // Generate TXT report
            let report = 'QUADRANT HEX ANALYSIS REPORT\n';
            report += '='.repeat(80) + '\n\n';
            report += `Total Pixels: ${analysisData.totalPixels.toLocaleString()}\n`;
            report += `Unique Colors: ${analysisData.uniqueColors}\n`;
            report += `Quadrants: ${analysisData.quadrantMap.size}\n\n`;
            report += '='.repeat(80) + '\n\n';

            const sortedQuadrants = Array.from(analysisData.quadrantMap.entries())
                .sort((a, b) => a[0] - b[0]);

            sortedQuadrants.forEach(([quadrant, qData]) => {
                report += `QUADRANT ${quadrant} (${getQuadrantName(quadrant)})\n`;
                report += `Total Pixels: ${qData.totalPixels.toLocaleString()}\n`;
                report += `Unique Colors: ${qData.hexCounts.size}\n\n`;
                
                const sortedHexes = Array.from(qData.hexCounts.entries())
                    .sort((a, b) => b[1] - a[1]);
                
                sortedHexes.forEach(([hex, count]) => {
                    const rgb = hexToRgb(hex);
                    const rgbStr = rgb ? `RGB(${rgb.r}, ${rgb.g}, ${rgb.b})` : '';
                    const pct = ((count / qData.totalPixels) * 100).toFixed(2);
                    report += `  ${hex} ${rgbStr} - ${count.toLocaleString()} pixels (${pct}%)\n`;
                });
                
                report += '\n' + '-'.repeat(80) + '\n\n';
            });

            const txtBlob = new Blob([report], { type: 'text/plain' });
            const txtUrl = URL.createObjectURL(txtBlob);
            const txtLink = document.createElement('a');
            txtLink.href = txtUrl;
            txtLink.download = 'quadrant-hex-analysis-report.txt';
            txtLink.click();
            URL.revokeObjectURL(txtUrl);

            // Generate CSV report
            let csv = 'quadrant,quadrant_name,hex,r,g,b,pixel_count,percentage\n';
            
            sortedQuadrants.forEach(([quadrant, qData]) => {
                const sortedHexes = Array.from(qData.hexCounts.entries())
                    .sort((a, b) => b[1] - a[1]);
                
                sortedHexes.forEach(([hex, count]) => {
                    const rgb = hexToRgb(hex);
                    const pct = ((count / qData.totalPixels) * 100).toFixed(2);
                    csv += `${quadrant},${getQuadrantName(quadrant)},${hex},${rgb.r},${rgb.g},${rgb.b},${count},${pct}\n`;
                });
            });

            const csvBlob = new Blob([csv], { type: 'text/csv' });
            const csvUrl = URL.createObjectURL(csvBlob);
            const csvLink = document.createElement('a');
            csvLink.href = csvUrl;
            csvLink.download = 'quadrant-hex-analysis.csv';
            csvLink.click();
            URL.revokeObjectURL(csvUrl);

            alert('Downloaded both TXT report and CSV file!');
        }

        function syncGlobalCheckbox(hex, checked) {
            // Sync all checkboxes with this hex code across all quadrants
            document.querySelectorAll(`.hex-checkbox[data-hex="${hex}"]`).forEach(checkbox => {
                checkbox.checked = checked;
            });
        }

        function selectAllGlobal() {
            document.querySelectorAll('.global-hex-checkbox').forEach(checkbox => {
                checkbox.checked = true;
                syncGlobalCheckbox(checkbox.dataset.hex, true);
            });
        }

        function deselectAllGlobal() {
            document.querySelectorAll('.global-hex-checkbox').forEach(checkbox => {
                checkbox.checked = false;
                syncGlobalCheckbox(checkbox.dataset.hex, false);
            });
        }

        function selectDarkOnly() {
            document.querySelectorAll('.global-hex-checkbox').forEach(checkbox => {
                const isDark = checkbox.dataset.dark === 'true';
                checkbox.checked = isDark;
                syncGlobalCheckbox(checkbox.dataset.hex, isDark);
            });
        }

        function selectLightOnly() {
            document.querySelectorAll('.global-hex-checkbox').forEach(checkbox => {
                const isDark = checkbox.dataset.dark === 'true';
                checkbox.checked = !isDark;
                syncGlobalCheckbox(checkbox.dataset.hex, !isDark);
            });
        }

        function reconstructSelected() {
            // Get selected hex codes from GLOBAL checkboxes only
            const selectedHexes = new Set();
            document.querySelectorAll('.global-hex-checkbox:checked').forEach(checkbox => {
                selectedHexes.add(checkbox.dataset.hex);
            });

            if (selectedHexes.size === 0) {
                alert('Please select at least one hex code to reconstruct!');
                return;
            }

            document.getElementById('canvasStatus').textContent = '⏳ Reconstructing selected colors...';

            // Find image dimensions
            let maxX = 0;
            let maxY = 0;
            allPixelsData.forEach(p => {
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
            });

            const width = maxX + 1;
            const height = maxY + 1;

            const canvas = document.getElementById('canvas');
            const gridCanvas = document.getElementById('gridCanvas');
            canvas.width = width;
            canvas.height = height;
            gridCanvas.width = width;
            gridCanvas.height = height;
            const ctx = canvas.getContext('2d');
            const gridCtx = gridCanvas.getContext('2d');

            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            gridCtx.clearRect(0, 0, width, height);

            setTimeout(function() {
                // Draw only selected pixels
                let reconstructedCount = 0;
                allPixelsData.forEach(p => {
                    if (selectedHexes.has(p.hex)) {
                        ctx.fillStyle = p.hex;
                        ctx.fillRect(p.x, p.y, 1, 1);
                        reconstructedCount++;
                    }
                });

                // Draw 64 Quadrant overlay (8x8 grid)
                const quadrantGridSize = 8;
                const quadrantWidth = width / quadrantGridSize;
                const quadrantHeight = height / quadrantGridSize;

                gridCtx.strokeStyle = 'rgba(255, 0, 255, 0.6)';
                gridCtx.lineWidth = 2;
                gridCtx.font = '12px monospace';
                gridCtx.fillStyle = 'rgba(255, 255, 0, 0.9)';

                // Draw vertical quadrant lines
                for (let col = 0; col <= quadrantGridSize; col++) {
                    const x = col * quadrantWidth;
                    gridCtx.beginPath();
                    gridCtx.moveTo(x, 0);
                    gridCtx.lineTo(x, height);
                    gridCtx.stroke();
                }

                // Draw horizontal quadrant lines
                for (let row = 0; row <= quadrantGridSize; row++) {
                    const y = row * quadrantHeight;
                    gridCtx.beginPath();
                    gridCtx.moveTo(0, y);
                    gridCtx.lineTo(width, y);
                    gridCtx.stroke();
                }

                // Draw quadrant numbers
                for (let row = 0; row < quadrantGridSize; row++) {
                    for (let col = 0; col < quadrantGridSize; col++) {
                        const quadNum = row * quadrantGridSize + col;
                        const x = col * quadrantWidth + 5;
                        const y = row * quadrantHeight + 15;
                        gridCtx.fillText('Q' + quadNum, x, y);
                    }
                }

                document.getElementById('canvasStatus').textContent = 
                    `✅ RECONSTRUCTED! ${reconstructedCount.toLocaleString()} pixels from ${selectedHexes.size} selected colors`;
                
                // Show SVG export button after reconstruction
                document.getElementById('exportSVGBtn').style.display = 'inline-block';
            }, 100);
        }

        function exportToSVG() {
            // Get selected hex codes from GLOBAL checkboxes only
            const selectedHexes = new Set();
            document.querySelectorAll('.global-hex-checkbox:checked').forEach(checkbox => {
                selectedHexes.add(checkbox.dataset.hex);
            });

            if (selectedHexes.size === 0) {
                alert('Please select at least one hex code to export!');
                return;
            }

            document.getElementById('canvasStatus').textContent = '⏳ Generating SVG...';

            // Find image dimensions
            let maxX = 0;
            let maxY = 0;
            allPixelsData.forEach(p => {
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
            });

            const width = maxX + 1;
            const height = maxY + 1;

            // Group pixels by color for efficient SVG generation
            const colorGroups = new Map();
            let includedPixels = 0;

            allPixelsData.forEach(p => {
                if (selectedHexes.has(p.hex)) {
                    if (!colorGroups.has(p.hex)) {
                        colorGroups.set(p.hex, []);
                    }
                    colorGroups.get(p.hex).push(p);
                    includedPixels++;
                }
            });

            // Generate SVG
            let svg = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            svg += `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">\n`;
            
            // Add each color group
            colorGroups.forEach((pixels, hex) => {
                svg += `  <g fill="${hex}">\n`;
                pixels.forEach(p => {
                    svg += `    <rect x="${p.x}" y="${p.y}" width="1" height="1"/>\n`;
                });
                svg += `  </g>\n`;
            });
            
            svg += `</svg>`;

            // Download SVG
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'reconstructed-font.svg';
            link.click();
            URL.revokeObjectURL(url);

            document.getElementById('canvasStatus').textContent = 
                `✅ SVG EXPORTED! ${includedPixels.toLocaleString()} pixels from ${selectedHexes.size} colors → reconstructed-font.svg`;
        }
    </script>
</body>
</html>
