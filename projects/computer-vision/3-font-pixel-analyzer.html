<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Pixel Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #0056b3;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            padding: 20px;
            background: #f0f8ff;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .color-section {
            margin-top: 30px;
        }
        .color-item {
            margin-bottom: 20px;
            padding: 15px;
            background: #fafafa;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        .color-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .color-info {
            flex: 1;
        }
        .color-hex {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
        }
        .color-rgb {
            font-family: monospace;
            font-size: 14px;
            color: #666;
        }
        .color-count {
            font-size: 14px;
            color: #666;
        }
        .coordinates {
            max-height: 200px;
            overflow-y: auto;
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        .toggle-coords {
            background: #6c757d;
            font-size: 12px;
            padding: 5px 10px;
            margin-top: 10px;
        }
        .toggle-coords:hover {
            background: #5a6268;
        }
        .hidden {
            display: none;
        }
        #downloadBtn {
            background: #28a745;
            margin-left: 10px;
        }
        #downloadBtn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Font Pixel Analyzer</h1>
        
        <div class="upload-section">
            <p><strong>Upload CSV from face-tool-v2.html</strong></p>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Expected format: x,y,gridX,gridY,distance_from_center,quadrant,hex</p>
            <input type="file" id="csvFile" accept=".csv">
            <button onclick="analyzeCSV()">Analyze</button>
            <button id="downloadBtn" onclick="downloadReport()" style="display:none;">Download Report</button>
        </div>

        <div id="stats" class="stats"></div>
        <div id="colorReport" class="color-section"></div>
    </div>

    <script>
        let analysisData = null;

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function analyzeCSV() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a CSV file');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.trim().split('\n');
                const header = lines[0];
                
                const colorMap = new Map();
                let totalPixels = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(',');
                    if (parts.length < 7) continue;
                    
                    const x = parts[0];
                    const y = parts[1];
                    const gridX = parts[2];
                    const gridY = parts[3];
                    const distance = parts[4];
                    const quadrant = parts[5];
                    const hex = parts[6].trim();
                    
                    if (!colorMap.has(hex)) {
                        colorMap.set(hex, []);
                    }
                    
                    colorMap.get(hex).push({
                        x: parseInt(x),
                        y: parseInt(y),
                        gridX: parseInt(gridX),
                        gridY: parseInt(gridY),
                        distance: parseFloat(distance),
                        quadrant: parseInt(quadrant)
                    });
                    
                    totalPixels++;
                }

                analysisData = {
                    totalPixels,
                    uniqueColors: colorMap.size,
                    colorMap
                };

                displayResults(analysisData);
            };
            
            reader.readAsText(file);
        }

        function displayResults(data) {
            const statsDiv = document.getElementById('stats');
            const colorReportDiv = document.getElementById('colorReport');
            
            statsDiv.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">Total Pixels</div>
                    <div class="stat-value">${data.totalPixels.toLocaleString()}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Unique Colors</div>
                    <div class="stat-value">${data.uniqueColors}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Avg Pixels/Color</div>
                    <div class="stat-value">${Math.round(data.totalPixels / data.uniqueColors).toLocaleString()}</div>
                </div>
            `;

            const sortedColors = Array.from(data.colorMap.entries())
                .sort((a, b) => b[1].length - a[1].length);

            let colorHTML = '<h2>Color Breakdown</h2>';
            
            sortedColors.forEach(([hex, coords], index) => {
                const rgb = hexToRgb(hex);
                const rgbString = rgb ? `RGB(${rgb.r}, ${rgb.g}, ${rgb.b})` : 'Invalid';
                
                colorHTML += `
                    <div class="color-item">
                        <div class="color-header">
                            <div class="color-swatch" style="background-color: ${hex}"></div>
                            <div class="color-info">
                                <div class="color-hex">${hex}</div>
                                <div class="color-rgb">${rgbString}</div>
                                <div class="color-count">${coords.length.toLocaleString()} pixels (${((coords.length / data.totalPixels) * 100).toFixed(2)}%)</div>
                            </div>
                        </div>
                        <button class="toggle-coords" onclick="toggleCoords(${index})">Show Coordinates</button>
                        <div id="coords-${index}" class="coordinates hidden">
                            ${coords.slice(0, 100).map(c => 
                                `(${c.x}, ${c.y}) grid:(${c.gridX}, ${c.gridY}) dist:${c.distance.toFixed(2)} quad:${c.quadrant}`
                            ).join('<br>')}
                            ${coords.length > 100 ? `<br><em>... and ${coords.length - 100} more</em>` : ''}
                        </div>
                    </div>
                `;
            });

            colorReportDiv.innerHTML = colorHTML;
            document.getElementById('downloadBtn').style.display = 'inline-block';
        }

        function toggleCoords(index) {
            const coordsDiv = document.getElementById(`coords-${index}`);
            coordsDiv.classList.toggle('hidden');
        }

        function downloadReport() {
            if (!analysisData) return;

            let report = 'FONT PIXEL ANALYSIS REPORT\n';
            report += '='.repeat(80) + '\n\n';
            report += `Total Pixels: ${analysisData.totalPixels.toLocaleString()}\n`;
            report += `Unique Colors: ${analysisData.uniqueColors}\n`;
            report += `Average Pixels per Color: ${Math.round(analysisData.totalPixels / analysisData.uniqueColors).toLocaleString()}\n\n`;
            report += '='.repeat(80) + '\n\n';

            const sortedColors = Array.from(analysisData.colorMap.entries())
                .sort((a, b) => b[1].length - a[1].length);

            sortedColors.forEach(([hex, coords]) => {
                const rgb = hexToRgb(hex);
                const rgbString = rgb ? `RGB(${rgb.r}, ${rgb.g}, ${rgb.b})` : 'Invalid';
                
                report += `COLOR: ${hex}\n`;
                report += `${rgbString}\n`;
                report += `Pixel Count: ${coords.length.toLocaleString()} (${((coords.length / analysisData.totalPixels) * 100).toFixed(2)}%)\n`;
                report += `\nCoordinates:\n`;
                
                coords.forEach(c => {
                    report += `  x:${c.x}, y:${c.y}, gridX:${c.gridX}, gridY:${c.gridY}, distance:${c.distance.toFixed(2)}, quadrant:${c.quadrant}\n`;
                });
                
                report += '\n' + '-'.repeat(80) + '\n\n';
            });

            const blob = new Blob([report], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'font-pixel-analysis-report.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
