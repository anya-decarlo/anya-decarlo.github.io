<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwhelming Calm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e1a;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Deep water gradient background */
        .water-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(15, 52, 96, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(26, 33, 62, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 14, 26, 0.9) 0%, #0a0e1a 100%);
            animation: waterShift 60s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes waterShift {
            0%, 100% { 
                background-position: 0% 0%, 100% 100%, 50% 50%;
            }
            50% { 
                background-position: 100% 100%, 0% 0%, 50% 50%;
            }
        }

        /* Bioluminescent particles */
        .bioluminescence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            filter: blur(3px);
            animation: float 45s ease-in-out infinite;
            opacity: 0.3;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.2;
            }
            25% {
                transform: translate(10px, -15px) scale(1.1);
                opacity: 0.4;
            }
            50% {
                transform: translate(-5px, -25px) scale(0.9);
                opacity: 0.3;
            }
            75% {
                transform: translate(-15px, -10px) scale(1.05);
                opacity: 0.35;
            }
        }

        /* Larger glowing orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            animation: orbPulse 50s ease-in-out infinite;
            opacity: 0.15;
        }

        @keyframes orbPulse {
            0%, 100% {
                transform: scale(1) translateY(0);
                opacity: 0.1;
            }
            50% {
                transform: scale(1.3) translateY(-30px);
                opacity: 0.2;
            }
        }

        /* Depth layers with blur */
        .depth-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .layer-1 { z-index: 3; filter: blur(1px); opacity: 0.7; }
        .layer-2 { z-index: 4; filter: blur(5px); opacity: 0.5; }
        .layer-3 { z-index: 5; filter: blur(15px); opacity: 0.3; }
        .layer-4 { z-index: 6; filter: blur(30px); opacity: 0.2; }

        /* Slow moving shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(102, 217, 239, 0.1) 0%, transparent 70%);
            animation: shapeFloat 90s linear infinite;
        }

        @keyframes shapeFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) translateX(50px) scale(1.2);
                opacity: 0;
            }
        }

        /* Water caustics effect */
        .caustics {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(102, 217, 239, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(102, 217, 239, 0.02) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(102, 217, 239, 0.02) 0%, transparent 50%);
            background-size: 200% 200%;
            animation: causticShift 40s ease-in-out infinite;
            z-index: 7;
            pointer-events: none;
            opacity: 0.4;
        }

        @keyframes causticShift {
            0%, 100% { 
                background-position: 0% 0%, 100% 100%, 50% 50%;
            }
            50% { 
                background-position: 100% 100%, 0% 0%, 70% 30%;
            }
        }

        /* Subtle grain texture */
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 8;
        }

        /* Breathing overlay */
        .breath {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 14, 26, 0.3) 100%);
            animation: breathe 35s ease-in-out infinite;
            z-index: 9;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.02);
            }
        }

        /* Very slow text fade in */
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Georgia', serif;
            font-size: 18px;
            color: rgba(102, 217, 239, 0.4);
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: messageFade 120s ease-in-out infinite;
            letter-spacing: 3px;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(102, 217, 239, 0.2);
        }

        @keyframes messageFade {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 0.3; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Deep water background -->
    <div class="water-bg"></div>

    <!-- Bioluminescent particles across multiple depth layers -->
    <div class="bioluminescence layer-1" id="layer1"></div>
    <div class="bioluminescence layer-2" id="layer2"></div>
    <div class="bioluminescence layer-3" id="layer3"></div>
    <div class="bioluminescence layer-4" id="layer4"></div>

    <!-- Water caustics -->
    <div class="caustics"></div>

    <!-- Grain texture -->
    <div class="grain"></div>

    <!-- Breathing overlay -->
    <div class="breath"></div>

    <!-- Slow fading message -->
    <div class="message">
        breathe
    </div>

    <script>
        // Bioluminescent color palette - deep ocean blues and teals
        const colors = [
            'rgba(102, 217, 239, 0.4)',  // Cyan
            'rgba(79, 193, 233, 0.3)',   // Light blue
            'rgba(22, 160, 133, 0.3)',   // Teal
            'rgba(52, 152, 219, 0.3)',   // Blue
            'rgba(155, 246, 255, 0.2)',  // Very light cyan
            'rgba(41, 128, 185, 0.3)',   // Deep blue
        ];

        // Generate particles for each depth layer
        function generateParticles(layerId, count, sizeRange, blurAmount) {
            const container = document.getElementById(layerId);
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random position
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                // Random size within range
                const size = Math.random() * (sizeRange[1] - sizeRange[0]) + sizeRange[0];
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Random color from palette
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
                
                // Random animation delay and duration
                const delay = Math.random() * 45;
                const duration = 40 + Math.random() * 20; // 40-60 seconds
                particle.style.animationDelay = delay + 's';
                particle.style.animationDuration = duration + 's';
                
                // Additional blur
                particle.style.filter = `blur(${blurAmount}px)`;
                
                container.appendChild(particle);
            }
        }

        // Generate larger glowing orbs
        function generateOrbs(count) {
            const body = document.body;
            
            for (let i = 0; i < count; i++) {
                const orb = document.createElement('div');
                orb.className = 'orb';
                orb.style.zIndex = '2';
                
                // Random position
                orb.style.left = Math.random() * 100 + '%';
                orb.style.top = Math.random() * 100 + '%';
                
                // Large size
                const size = 200 + Math.random() * 300;
                orb.style.width = size + 'px';
                orb.style.height = size + 'px';
                
                // Soft color
                const color = colors[Math.floor(Math.random() * colors.length)];
                orb.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
                
                // Random animation
                const delay = Math.random() * 50;
                const duration = 45 + Math.random() * 30;
                orb.style.animationDelay = delay + 's';
                orb.style.animationDuration = duration + 's';
                
                body.appendChild(orb);
            }
        }

        // Generate slow floating shapes
        function generateShapes(count) {
            const body = document.body;
            
            for (let i = 0; i < count; i++) {
                const shape = document.createElement('div');
                shape.className = 'shape';
                shape.style.zIndex = '3';
                
                // Random horizontal position
                shape.style.left = Math.random() * 100 + '%';
                shape.style.bottom = '-100px';
                
                // Random size
                const size = 100 + Math.random() * 200;
                shape.style.width = size + 'px';
                shape.style.height = size + 'px';
                
                // Random animation delay
                const delay = Math.random() * 90;
                shape.style.animationDelay = delay + 's';
                
                body.appendChild(shape);
            }
        }

        // Layer 1: Closest, smallest particles, least blur
        generateParticles('layer1', 30, [2, 5], 2);
        
        // Layer 2: Medium distance, medium particles
        generateParticles('layer2', 25, [3, 7], 4);
        
        // Layer 3: Far, larger particles, more blur
        generateParticles('layer3', 20, [5, 10], 8);
        
        // Layer 4: Farthest, largest particles, maximum blur
        generateParticles('layer4', 15, [8, 15], 15);

        // Generate large glowing orbs
        generateOrbs(8);

        // Generate slow floating shapes
        generateShapes(5);

        // Slow color shift on message
        const message = document.querySelector('.message');
        setInterval(() => {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            message.style.color = randomColor;
            message.style.textShadow = `0 0 20px ${randomColor}`;
        }, 30000); // Every 30 seconds
    </script>
</body>
</html>
