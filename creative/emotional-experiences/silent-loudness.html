<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Loudness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* VIBRATING BACKGROUND */
        .vibrate-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(0deg, #FF0000 0%, #00FF00 50%, #0000FF 100%);
            animation: vibrateColors 0.1s linear infinite;
            z-index: 1;
        }

        @keyframes vibrateColors {
            0% { filter: hue-rotate(0deg) contrast(1.5); }
            25% { filter: hue-rotate(90deg) contrast(2); }
            50% { filter: hue-rotate(180deg) contrast(1.5); }
            75% { filter: hue-rotate(270deg) contrast(2); }
            100% { filter: hue-rotate(360deg) contrast(1.5); }
        }

        /* MOIRÉ PATTERN LAYERS */
        .moire-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.3) 2px,
                rgba(255, 255, 255, 0.3) 4px
            );
            animation: moireShift 2s linear infinite;
            z-index: 2;
        }

        @keyframes moireShift {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(20px) rotate(5deg); }
        }

        .moire-layer-2 {
            background-image: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.3) 2px,
                rgba(255, 255, 255, 0.3) 4px
            );
            animation: moireShift2 1.5s linear infinite;
        }

        @keyframes moireShift2 {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(20px) rotate(-5deg); }
        }

        /* RAPID FLASH STRIPES */
        .flash-stripe {
            position: fixed;
            width: 100%;
            height: 20%;
            animation: flashStripe 0.15s linear infinite;
            z-index: 3;
        }

        @keyframes flashStripe {
            0%, 100% { 
                background: rgba(255, 0, 0, 0.3);
                opacity: 1;
            }
            25% { 
                background: rgba(0, 255, 0, 0.3);
                opacity: 0.5;
            }
            50% { 
                background: rgba(0, 0, 255, 0.3);
                opacity: 1;
            }
            75% { 
                background: rgba(255, 255, 0, 0.3);
                opacity: 0.5;
            }
        }

        /* VIBRATING CIRCLES */
        .vibrate-circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid;
            animation: circleVibrate 0.08s linear infinite;
        }

        @keyframes circleVibrate {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                border-color: #FF00FF;
            }
            25% { 
                transform: translate(-48%, -52%) scale(1.02);
                border-color: #00FFFF;
            }
            50% { 
                transform: translate(-52%, -48%) scale(0.98);
                border-color: #FFFF00;
            }
            75% { 
                transform: translate(-48%, -48%) scale(1.01);
                border-color: #FF0000;
            }
        }

        /* RAPID PULSE SQUARES */
        .pulse-square {
            position: absolute;
            animation: squarePulse 0.12s ease-in-out infinite;
        }

        @keyframes squarePulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                background: rgba(255, 0, 255, 0.5);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.1) rotate(5deg);
                background: rgba(0, 255, 255, 0.5);
            }
        }

        /* FREQUENCY BARS */
        .freq-bar {
            position: absolute;
            bottom: 0;
            width: 2%;
            background: linear-gradient(to top, #FF0000, #FF00FF, #0000FF);
            animation: freqBounce 0.1s ease-in-out infinite;
        }

        @keyframes freqBounce {
            0%, 100% {
                height: 20%;
                opacity: 1;
            }
            50% {
                height: 80%;
                opacity: 0.7;
            }
        }

        /* STATIC NOISE */
        .static {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='5' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.3;
            z-index: 8;
            pointer-events: none;
            animation: staticFlicker 0.05s infinite;
        }

        @keyframes staticFlicker {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.5; }
        }

        /* OSCILLATING LINES */
        .oscillate-line {
            position: absolute;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            animation: oscillate 0.2s ease-in-out infinite;
        }

        @keyframes oscillate {
            0%, 100% {
                transform: translateY(0) scaleX(1);
            }
            25% {
                transform: translateY(-5px) scaleX(1.05);
            }
            50% {
                transform: translateY(0) scaleX(0.95);
            }
            75% {
                transform: translateY(5px) scaleX(1.05);
            }
        }

        /* CONTRAST FLICKER */
        .contrast-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 0%, rgba(0, 0, 0, 0.5) 100%);
            animation: contrastFlicker 0.15s ease-in-out infinite;
            z-index: 7;
            pointer-events: none;
        }

        @keyframes contrastFlicker {
            0%, 100% {
                opacity: 0.5;
                filter: contrast(1);
            }
            50% {
                opacity: 0.8;
                filter: contrast(2);
            }
        }

        /* VISUAL WAVEFORM */
        .waveform {
            position: absolute;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.7);
            animation: waveMove 0.3s ease-in-out infinite;
        }

        @keyframes waveMove {
            0%, 100% {
                transform: scaleY(1) translateY(0);
            }
            25% {
                transform: scaleY(3) translateY(-10px);
            }
            50% {
                transform: scaleY(1) translateY(0);
            }
            75% {
                transform: scaleY(3) translateY(10px);
            }
        }

        /* CHROMATIC ABERRATION */
        .chromatic {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9;
            mix-blend-mode: screen;
            animation: chromaticShift 0.1s linear infinite;
        }

        .chromatic::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.2);
            animation: redShift 0.1s linear infinite;
        }

        .chromatic::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 255, 0.2);
            animation: cyanShift 0.1s linear infinite;
        }

        @keyframes redShift {
            0%, 100% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
        }

        @keyframes cyanShift {
            0%, 100% { transform: translateX(2px); }
            50% { transform: translateX(-2px); }
        }

        /* VOLUME INDICATOR */
        .volume {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Arial Black', sans-serif;
            font-size: 120px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 
                0 0 10px #FF0000,
                0 0 20px #00FF00,
                0 0 30px #0000FF;
            z-index: 10;
            animation: volumePulse 0.1s ease-in-out infinite;
        }

        @keyframes volumePulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Vibrating background -->
    <div class="vibrate-bg"></div>

    <!-- Moiré patterns -->
    <div class="moire-layer"></div>
    <div class="moire-layer moire-layer-2"></div>

    <!-- Flash stripes -->
    <div class="flash-stripe" style="top: 0%;"></div>
    <div class="flash-stripe" style="top: 20%; animation-delay: 0.03s;"></div>
    <div class="flash-stripe" style="top: 40%; animation-delay: 0.06s;"></div>
    <div class="flash-stripe" style="top: 60%; animation-delay: 0.09s;"></div>
    <div class="flash-stripe" style="top: 80%; animation-delay: 0.12s;"></div>

    <!-- Frequency bars container -->
    <div id="freqBars"></div>

    <!-- Vibrating circles container -->
    <div id="vibrateCircles"></div>

    <!-- Pulse squares container -->
    <div id="pulseSquares"></div>

    <!-- Oscillating lines container -->
    <div id="oscillateLines"></div>

    <!-- Waveforms container -->
    <div id="waveforms"></div>

    <!-- Contrast layer -->
    <div class="contrast-layer"></div>

    <!-- Static noise -->
    <div class="static"></div>

    <!-- Chromatic aberration -->
    <div class="chromatic"></div>

    <!-- Volume indicator -->
    <div class="volume">|||</div>

    <script>
        // Generate frequency bars (like audio visualizer)
        function generateFreqBars() {
            const container = document.getElementById('freqBars');
            for (let i = 0; i < 50; i++) {
                const bar = document.createElement('div');
                bar.className = 'freq-bar';
                bar.style.left = (i * 2) + '%';
                bar.style.animationDelay = (i * 0.02) + 's';
                bar.style.animationDuration = (0.08 + Math.random() * 0.04) + 's';
                bar.style.zIndex = '4';
                container.appendChild(bar);
            }
        }

        // Generate vibrating circles
        function generateVibrateCircles() {
            const container = document.getElementById('vibrateCircles');
            for (let i = 0; i < 15; i++) {
                const circle = document.createElement('div');
                circle.className = 'vibrate-circle';
                const size = 50 + Math.random() * 200;
                circle.style.width = size + 'px';
                circle.style.height = size + 'px';
                circle.style.left = Math.random() * 100 + '%';
                circle.style.top = Math.random() * 100 + '%';
                circle.style.animationDelay = (Math.random() * 0.08) + 's';
                circle.style.zIndex = '5';
                container.appendChild(circle);
            }
        }

        // Generate pulse squares
        function generatePulseSquares() {
            const container = document.getElementById('pulseSquares');
            for (let i = 0; i < 20; i++) {
                const square = document.createElement('div');
                square.className = 'pulse-square';
                const size = 30 + Math.random() * 80;
                square.style.width = size + 'px';
                square.style.height = size + 'px';
                square.style.left = Math.random() * 100 + '%';
                square.style.top = Math.random() * 100 + '%';
                square.style.animationDelay = (Math.random() * 0.12) + 's';
                square.style.zIndex = '6';
                container.appendChild(square);
            }
        }

        // Generate oscillating lines
        function generateOscillateLines() {
            const container = document.getElementById('oscillateLines');
            for (let i = 0; i < 30; i++) {
                const line = document.createElement('div');
                line.className = 'oscillate-line';
                line.style.width = (50 + Math.random() * 50) + '%';
                line.style.left = Math.random() * 50 + '%';
                line.style.top = (i * 3.33) + '%';
                line.style.animationDelay = (Math.random() * 0.2) + 's';
                line.style.animationDuration = (0.15 + Math.random() * 0.1) + 's';
                line.style.zIndex = '5';
                container.appendChild(line);
            }
        }

        // Generate waveforms
        function generateWaveforms() {
            const container = document.getElementById('waveforms');
            for (let i = 0; i < 10; i++) {
                const wave = document.createElement('div');
                wave.className = 'waveform';
                wave.style.top = (i * 10) + '%';
                wave.style.animationDelay = (i * 0.03) + 's';
                wave.style.animationDuration = (0.25 + Math.random() * 0.1) + 's';
                wave.style.zIndex = '6';
                container.appendChild(wave);
            }
        }

        // Initialize
        generateFreqBars();
        generateVibrateCircles();
        generatePulseSquares();
        generateOscillateLines();
        generateWaveforms();

        // Animate volume indicator
        const volumeIndicators = ['|', '||', '|||', '||||', '|||||', '||||||'];
        const volumeElement = document.querySelector('.volume');
        let volumeIndex = 0;
        
        setInterval(() => {
            volumeIndex = (volumeIndex + 1) % volumeIndicators.length;
            volumeElement.textContent = volumeIndicators[volumeIndex];
        }, 100);

        // Random intensity bursts
        setInterval(() => {
            if (Math.random() < 0.3) {
                document.body.style.animation = 'none';
                document.body.style.filter = 'contrast(3) saturate(2)';
                setTimeout(() => {
                    document.body.style.filter = 'contrast(1) saturate(1)';
                }, 50);
            }
        }, 200);
    </script>
</body>
</html>
