<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOSTALGIC FUTURE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: 'Courier New', monospace;
        }

        /* 80s NEON GRID */
        .retro-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(255, 0, 255, 0.3) 25%, rgba(255, 0, 255, 0.3) 26%, transparent 27%, transparent 74%, rgba(255, 0, 255, 0.3) 75%, rgba(255, 0, 255, 0.3) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 255, 0.3) 25%, rgba(0, 255, 255, 0.3) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, 0.3) 75%, rgba(0, 255, 255, 0.3) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            animation: gridScroll 20s linear infinite;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center bottom;
            z-index: 1;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 50px, 0 0; }
        }

        /* HOLOGRAPHIC GRADIENT */
        .hologram {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(255, 0, 255, 0.2) 0%,
                rgba(0, 255, 255, 0.2) 25%,
                rgba(255, 0, 128, 0.2) 50%,
                rgba(128, 0, 255, 0.2) 75%,
                rgba(255, 0, 255, 0.2) 100%);
            background-size: 400% 400%;
            animation: holoShift 8s ease infinite;
            z-index: 2;
        }

        @keyframes holoShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* VHS SCAN LINES */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 10;
            pointer-events: none;
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        /* CRT SCREEN CURVATURE */
        .crt-container {
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            border-radius: 20px;
            overflow: hidden;
            z-index: 3;
            box-shadow: 
                inset 0 0 100px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(255, 0, 255, 0.3);
        }

        /* CHROMATIC ABERRATION */
        .chromatic {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            mix-blend-mode: screen;
        }

        .chromatic::before {
            content: '';
            position: absolute;
            top: 0;
            left: -2px;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.1);
        }

        .chromatic::after {
            content: '';
            position: absolute;
            top: 0;
            left: 2px;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 255, 0.1);
        }

        /* VHS NOISE */
        .vhs-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='3' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.08;
            z-index: 9;
            pointer-events: none;
            animation: noiseFlicker 0.2s infinite;
        }

        @keyframes noiseFlicker {
            0%, 100% { opacity: 0.08; }
            50% { opacity: 0.12; }
        }

        /* RETRO TERMINAL TEXT */
        .terminal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #00FF00;
            text-shadow: 
                0 0 10px #00FF00,
                0 0 20px #00FF00,
                0 0 30px #00FF00;
            z-index: 8;
            text-align: center;
            line-height: 1.6;
            filter: contrast(1.2) brightness(1.1);
        }

        .terminal .cursor {
            display: inline-block;
            width: 12px;
            height: 24px;
            background: #00FF00;
            animation: cursorBlink 1s step-end infinite;
            margin-left: 5px;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* NEON SHAPES */
        .neon-shape {
            position: absolute;
            border: 3px solid;
            animation: neonFloat 15s ease-in-out infinite;
            filter: drop-shadow(0 0 10px currentColor);
        }

        @keyframes neonFloat {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -30px) rotate(90deg);
            }
            50% {
                transform: translate(0, -60px) rotate(180deg);
            }
            75% {
                transform: translate(-30px, -30px) rotate(270deg);
            }
        }

        /* GLITCH EFFECT */
        .glitch {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            font-weight: 900;
            color: #FF00FF;
            text-transform: uppercase;
            z-index: 7;
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                transform: translateX(-50%) translate(0);
                text-shadow: 
                    -2px 0 #00FFFF,
                    2px 0 #FF00FF;
            }
            25% {
                transform: translateX(-50%) translate(-5px, 5px);
                text-shadow: 
                    5px 0 #00FFFF,
                    -5px 0 #FF00FF;
            }
            50% {
                transform: translateX(-50%) translate(5px, -5px);
                text-shadow: 
                    -5px 0 #00FFFF,
                    5px 0 #FF00FF;
            }
            75% {
                transform: translateX(-50%) translate(-5px, -5px);
                text-shadow: 
                    2px 0 #00FFFF,
                    -2px 0 #FF00FF;
            }
        }

        /* RETRO PARTICLES */
        .retro-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FF00FF;
            box-shadow: 0 0 10px #FF00FF;
            animation: particleRise 10s linear infinite;
        }

        @keyframes particleRise {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(50px);
                opacity: 0;
            }
        }

        /* TRACKING LINES (VHS artifact) */
        .tracking {
            position: fixed;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            z-index: 11;
            animation: trackingMove 3s linear infinite;
        }

        @keyframes trackingMove {
            0% { top: -10px; }
            100% { top: 110%; }
        }

        /* DATE/TIME OVERLAY (VHS style) */
        .vhs-timestamp {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #FFFF00;
            text-shadow: 
                0 0 5px #FFFF00,
                2px 2px 0 rgba(0, 0, 0, 0.8);
            z-index: 12;
            letter-spacing: 2px;
        }

        /* PLAY/REC indicator */
        .rec-indicator {
            position: fixed;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #FF0000;
            text-shadow: 0 0 10px #FF0000;
            z-index: 12;
            animation: recBlink 1.5s ease-in-out infinite;
        }

        .rec-dot {
            width: 15px;
            height: 15px;
            background: #FF0000;
            border-radius: 50%;
            box-shadow: 0 0 20px #FF0000;
        }

        @keyframes recBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- Retro grid background -->
    <div class="retro-grid"></div>

    <!-- Holographic gradient -->
    <div class="hologram"></div>

    <!-- CRT container -->
    <div class="crt-container"></div>

    <!-- Chromatic aberration -->
    <div class="chromatic"></div>

    <!-- VHS noise -->
    <div class="vhs-noise"></div>

    <!-- Scan lines -->
    <div class="scanlines"></div>

    <!-- Tracking lines -->
    <div class="tracking"></div>

    <!-- REC indicator -->
    <div class="rec-indicator">
        <div class="rec-dot"></div>
        <span>● REC</span>
    </div>

    <!-- VHS timestamp -->
    <div class="vhs-timestamp" id="timestamp">12:00:00 AM  01/01/1987</div>

    <!-- Glitch title -->
    <div class="glitch">FUTURE MEMORY</div>

    <!-- Terminal text -->
    <div class="terminal">
        <div id="terminalText">LOADING TOMORROW'S NOSTALGIA...</div>
        <span class="cursor"></span>
    </div>

    <!-- Neon shapes container -->
    <div id="neonShapes"></div>

    <!-- Retro particles container -->
    <div id="retroParticles"></div>

    <script>
        // Neon colors (80s palette)
        const neonColors = ['#FF00FF', '#00FFFF', '#FF0080', '#8000FF', '#FFFF00'];

        // Generate neon shapes
        function generateNeonShapes() {
            const container = document.getElementById('neonShapes');
            const shapes = ['square', 'triangle', 'circle'];
            
            for (let i = 0; i < 15; i++) {
                const shape = document.createElement('div');
                shape.className = 'neon-shape';
                
                const shapeType = shapes[Math.floor(Math.random() * shapes.length)];
                const size = 40 + Math.random() * 80;
                
                shape.style.left = Math.random() * 100 + '%';
                shape.style.top = Math.random() * 100 + '%';
                shape.style.width = size + 'px';
                shape.style.height = size + 'px';
                shape.style.borderColor = neonColors[Math.floor(Math.random() * neonColors.length)];
                shape.style.animationDelay = Math.random() * 15 + 's';
                shape.style.animationDuration = (10 + Math.random() * 10) + 's';
                shape.style.zIndex = '5';
                
                if (shapeType === 'triangle') {
                    shape.style.borderRadius = '0';
                    shape.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
                } else if (shapeType === 'circle') {
                    shape.style.borderRadius = '50%';
                }
                
                container.appendChild(shape);
            }
        }

        // Generate retro particles
        function generateRetroParticles() {
            const container = document.getElementById('retroParticles');
            
            setInterval(() => {
                const particle = document.createElement('div');
                particle.className = 'retro-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-10px';
                particle.style.background = neonColors[Math.floor(Math.random() * neonColors.length)];
                particle.style.boxShadow = `0 0 10px ${neonColors[Math.floor(Math.random() * neonColors.length)]}`;
                particle.style.animationDuration = (8 + Math.random() * 4) + 's';
                particle.style.zIndex = '6';
                
                container.appendChild(particle);
                
                setTimeout(() => particle.remove(), 12000);
            }, 500);
        }

        // Update VHS timestamp (but with future dates mixed in)
        function updateTimestamp() {
            const now = new Date();
            
            // Randomly show past or future dates
            const yearOffset = Math.random() > 0.5 ? 
                -Math.floor(Math.random() * 40) : // Past (1987-2026)
                Math.floor(Math.random() * 40);   // Future (2026-2066)
            
            const displayDate = new Date(now.getFullYear() + yearOffset, now.getMonth(), now.getDate());
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const month = String(displayDate.getMonth() + 1).padStart(2, '0');
            const day = String(displayDate.getDate()).padStart(2, '0');
            const year = displayDate.getFullYear();
            
            document.getElementById('timestamp').textContent = 
                `${hours}:${minutes}:${seconds}  ${month}/${day}/${year}`;
        }

        // Terminal text cycling
        const terminalTexts = [
            'LOADING TOMORROW\'S NOSTALGIA...',
            'REMEMBERING THE FUTURE...',
            'ACCESSING MEMORIES NOT YET MADE...',
            'BLADE RUNNER MEETS WINDOWS 95...',
            'THE PAST\'S VISION OF NOW...',
            'RETRO-FUTURISM ENGAGED...',
            'NEON DREAMS LOADING...',
            'CYBERPUNK MEMORIES INITIALIZING...'
        ];
        
        let textIndex = 0;
        function cycleTerminalText() {
            textIndex = (textIndex + 1) % terminalTexts.length;
            document.getElementById('terminalText').textContent = terminalTexts[textIndex];
        }

        // Initialize
        generateNeonShapes();
        generateRetroParticles();
        updateTimestamp();
        setInterval(updateTimestamp, 1000);
        setInterval(cycleTerminalText, 4000);

        // Random glitch effect on title
        setInterval(() => {
            const glitch = document.querySelector('.glitch');
            if (Math.random() < 0.1) {
                glitch.style.animation = 'none';
                setTimeout(() => {
                    glitch.style.animation = 'glitch 1s infinite';
                }, 50);
            }
        }, 2000);
    </script>
</body>
</html>
