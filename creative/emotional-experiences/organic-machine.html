<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0505;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* FLESH GRADIENT BACKGROUND */
        .flesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(139, 69, 69, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(178, 34, 34, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(72, 61, 139, 0.2) 0%, transparent 60%),
                linear-gradient(135deg, #0a0505 0%, #1a0a0f 50%, #0f0a15 100%);
            animation: fleshPulse 8s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes fleshPulse {
            0%, 100% { 
                filter: brightness(1) saturate(1);
            }
            50% { 
                filter: brightness(1.2) saturate(1.3);
            }
        }

        /* BREATHING CONTAINER */
        .breath-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: breathe 4s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }

        /* VEIN CIRCUITS */
        .vein {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%,
                rgba(220, 20, 60, 0.6) 20%,
                rgba(255, 69, 0, 0.8) 50%,
                rgba(220, 20, 60, 0.6) 80%,
                transparent 100%);
            box-shadow: 0 0 10px rgba(220, 20, 60, 0.5);
            animation: bloodFlow 3s ease-in-out infinite;
            transform-origin: left center;
        }

        @keyframes bloodFlow {
            0%, 100% {
                opacity: 0.4;
                filter: brightness(1);
            }
            50% {
                opacity: 0.8;
                filter: brightness(1.5);
            }
        }

        /* PULSE NODES (like heart valves) */
        .node {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.8) 0%, rgba(220, 20, 60, 0.4) 70%);
            box-shadow: 
                0 0 20px rgba(255, 69, 0, 0.6),
                inset 0 0 10px rgba(139, 0, 0, 0.5);
            animation: heartbeat 2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.6;
            }
            14% { 
                transform: scale(1.3);
                opacity: 1;
            }
            28% { 
                transform: scale(1);
                opacity: 0.6;
            }
            42% { 
                transform: scale(1.3);
                opacity: 1;
            }
            56% { 
                transform: scale(1);
                opacity: 0.6;
            }
        }

        /* ORGANIC PARTICLES (like cells) */
        .cell {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 182, 193, 0.3) 0%,
                rgba(219, 112, 147, 0.2) 50%,
                transparent 100%);
            animation: cellFloat 20s ease-in-out infinite;
            filter: blur(2px);
        }

        @keyframes cellFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(20px, -30px) scale(1.1);
            }
            50% {
                transform: translate(-10px, -50px) scale(0.9);
            }
            75% {
                transform: translate(-30px, -20px) scale(1.05);
            }
        }

        /* MEMBRANE OVERLAY */
        .membrane {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, 
                transparent 0%,
                rgba(139, 69, 69, 0.1) 50%,
                rgba(72, 61, 139, 0.2) 100%);
            animation: membraneShift 12s ease-in-out infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes membraneShift {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.05);
            }
        }

        /* NEURAL NETWORK LINES */
        .neural-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(138, 43, 226, 0.4) 50%,
                transparent 100%);
            box-shadow: 0 0 5px rgba(138, 43, 226, 0.3);
            animation: neuralPulse 5s ease-in-out infinite;
        }

        @keyframes neuralPulse {
            0%, 100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.6;
                box-shadow: 0 0 10px rgba(138, 43, 226, 0.6);
            }
        }

        /* ORGANIC TEXTURE */
        .texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            z-index: 6;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* CENTRAL CORE (like a heart) */
        .core {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255, 69, 0, 0.6) 0%,
                rgba(220, 20, 60, 0.4) 40%,
                rgba(139, 0, 0, 0.2) 70%,
                transparent 100%);
            box-shadow: 
                0 0 50px rgba(255, 69, 0, 0.5),
                inset 0 0 30px rgba(139, 0, 0, 0.4);
            animation: coreHeartbeat 2s ease-in-out infinite;
            z-index: 4;
        }

        @keyframes coreHeartbeat {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
            14% { 
                transform: translate(-50%, -50%) scale(1.15);
                filter: brightness(1.3);
            }
            28% { 
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
            42% { 
                transform: translate(-50%, -50%) scale(1.15);
                filter: brightness(1.3);
            }
            56% { 
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
        }

        /* CORE RINGS */
        .core-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(220, 20, 60, 0.3);
            animation: ringExpand 2s ease-out infinite;
        }

        @keyframes ringExpand {
            0% {
                width: 150px;
                height: 150px;
                opacity: 0.6;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* STATUS TEXT */
        .status {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: rgba(220, 20, 60, 0.6);
            text-align: center;
            z-index: 10;
            letter-spacing: 3px;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% {
                opacity: 0.4;
            }
            14%, 42% {
                opacity: 0.8;
            }
            28%, 56% {
                opacity: 0.4;
            }
        }

        /* CAPILLARY NETWORK */
        .capillary {
            position: absolute;
            width: 1px;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(178, 34, 34, 0.3) 50%,
                transparent 100%);
            animation: capillaryFlow 6s ease-in-out infinite;
        }

        @keyframes capillaryFlow {
            0%, 100% {
                opacity: 0.2;
                height: 100px;
            }
            50% {
                opacity: 0.5;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Flesh background -->
    <div class="flesh-bg"></div>

    <!-- Breathing container -->
    <div class="breath-container">
        <!-- Vein circuits -->
        <div id="veins"></div>
        
        <!-- Neural network -->
        <div id="neuralNetwork"></div>
        
        <!-- Capillaries -->
        <div id="capillaries"></div>
        
        <!-- Pulse nodes -->
        <div id="nodes"></div>
        
        <!-- Organic cells -->
        <div id="cells"></div>
    </div>

    <!-- Central core (heart) -->
    <div class="core">
        <div class="core-ring" style="animation-delay: 0s;"></div>
        <div class="core-ring" style="animation-delay: 1s;"></div>
    </div>

    <!-- Membrane overlay -->
    <div class="membrane"></div>

    <!-- Organic texture -->
    <div class="texture"></div>

    <!-- Status text -->
    <div class="status">SYSTEM ALIVE • CIRCUITS BREATHING • HEARTBEAT DETECTED</div>

    <script>
        // Generate vein circuits (like blood vessels)
        function generateVeins() {
            const container = document.getElementById('veins');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < 30; i++) {
                const vein = document.createElement('div');
                vein.className = 'vein';
                
                const angle = (Math.PI * 2 * i) / 30;
                const length = 200 + Math.random() * 300;
                
                vein.style.width = length + 'px';
                vein.style.left = centerX + 'px';
                vein.style.top = centerY + 'px';
                vein.style.transform = `rotate(${angle}rad)`;
                vein.style.animationDelay = (Math.random() * 3) + 's';
                vein.style.animationDuration = (2.5 + Math.random() * 1) + 's';
                
                container.appendChild(vein);
            }
        }

        // Generate pulse nodes (connection points)
        function generateNodes() {
            const container = document.getElementById('nodes');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < 20; i++) {
                const node = document.createElement('div');
                node.className = 'node';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 150 + Math.random() * 250;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;
                
                node.style.left = x + 'px';
                node.style.top = y + 'px';
                node.style.animationDelay = (Math.random() * 2) + 's';
                
                container.appendChild(node);
            }
        }

        // Generate organic cells
        function generateCells() {
            const container = document.getElementById('cells');
            
            for (let i = 0; i < 40; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const size = 20 + Math.random() * 60;
                cell.style.width = size + 'px';
                cell.style.height = size + 'px';
                cell.style.left = Math.random() * 100 + '%';
                cell.style.top = Math.random() * 100 + '%';
                cell.style.animationDelay = (Math.random() * 20) + 's';
                cell.style.animationDuration = (15 + Math.random() * 10) + 's';
                
                container.appendChild(cell);
            }
        }

        // Generate neural network lines
        function generateNeuralNetwork() {
            const container = document.getElementById('neuralNetwork');
            
            for (let i = 0; i < 25; i++) {
                const line = document.createElement('div');
                line.className = 'neural-line';
                
                const length = 100 + Math.random() * 300;
                const angle = Math.random() * 360;
                
                line.style.width = length + 'px';
                line.style.left = Math.random() * 100 + '%';
                line.style.top = Math.random() * 100 + '%';
                line.style.transform = `rotate(${angle}deg)`;
                line.style.animationDelay = (Math.random() * 5) + 's';
                line.style.animationDuration = (4 + Math.random() * 3) + 's';
                
                container.appendChild(line);
            }
        }

        // Generate capillary network
        function generateCapillaries() {
            const container = document.getElementById('capillaries');
            
            for (let i = 0; i < 50; i++) {
                const capillary = document.createElement('div');
                capillary.className = 'capillary';
                
                capillary.style.left = Math.random() * 100 + '%';
                capillary.style.top = Math.random() * 100 + '%';
                capillary.style.height = (80 + Math.random() * 100) + 'px';
                capillary.style.animationDelay = (Math.random() * 6) + 's';
                capillary.style.animationDuration = (5 + Math.random() * 3) + 's';
                
                container.appendChild(capillary);
            }
        }

        // Initialize
        generateVeins();
        generateNodes();
        generateCells();
        generateNeuralNetwork();
        generateCapillaries();

        // Heartbeat sound simulation (visual feedback)
        const status = document.querySelector('.status');
        const statusTexts = [
            'SYSTEM ALIVE • CIRCUITS BREATHING • HEARTBEAT DETECTED',
            'ORGANIC MACHINE • PULSE STABLE • NEURAL ACTIVE',
            'BIOLOGICAL TECH • VEINS FLOWING • CONSCIOUSNESS ONLINE',
            'LIVING SYSTEM • HEARTBEAT 72 BPM • CIRCUITS PULSING'
        ];
        
        let statusIndex = 0;
        setInterval(() => {
            statusIndex = (statusIndex + 1) % statusTexts.length;
            status.textContent = statusTexts[statusIndex];
        }, 8000);
    </script>
</body>
</html>
