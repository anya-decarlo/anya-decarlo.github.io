<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warm Solitude</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d0906; cursor: none; }
  canvas { display: block; }
  .caption {
    position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%);
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    color: rgba(255, 214, 160, 0.55); font-size: 18px; letter-spacing: 3px;
    text-align: center; opacity: 0; animation: fadeIn 6s ease 2s forwards; pointer-events: none;
  }
  .caption small { display: block; font-size: 12px; letter-spacing: 2px; margin-top: 10px; color: rgba(255, 214, 160, 0.3); }
  .back {
    position: fixed; top: 20px; left: 24px; font-family: Georgia, serif; font-size: 13px;
    color: rgba(255, 214, 160, 0.35); text-decoration: none; letter-spacing: 1px; cursor: pointer; z-index: 2;
  }
  .back:hover { color: rgba(255, 214, 160, 0.8); }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<a class="back" href="index.html">← all emotions</a>
<canvas id="c"></canvas>
<div class="caption">alone, and that's okay<small>move the lamp · listen to the rain</small></div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, win;
const mouse = { x: innerWidth * 0.35, y: innerHeight * 0.55 };
const lamp = { x: mouse.x, y: mouse.y };
let drops = [], streaks = [], motes = [];

function resize() {
  W = c.width = innerWidth; H = c.height = innerHeight;
  win = { x: W * 0.58, y: H * 0.12, w: W * 0.32, h: H * 0.58 };
  drops = Array.from({ length: 70 }, newDrop);
  motes = Array.from({ length: 140 }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4,
    vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.08 - 0.03, p: Math.random() * Math.PI * 2
  }));
}
function newDrop() {
  return { x: win.x + Math.random() * win.w, y: win.y + Math.random() * win.h,
    r: Math.random() * 2 + 1, v: 0, stick: Math.random() * 200 };
}
addEventListener('resize', resize);
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
resize();

function frame(t) {
  const s = t / 1000;
  const breathe = 0.85 + 0.15 * Math.sin(s * Math.PI * 2 / 8);
  const flicker = 1 + 0.02 * Math.sin(s * 23) + 0.015 * Math.sin(s * 37);
  lamp.x += (mouse.x - lamp.x) * 0.02;
  lamp.y += (mouse.y - lamp.y) * 0.02;

  ctx.fillStyle = '#0d0906';
  ctx.fillRect(0, 0, W, H);

  // the night outside
  const night = ctx.createLinearGradient(0, win.y, 0, win.y + win.h);
  night.addColorStop(0, '#0b1424'); night.addColorStop(1, '#141c2c');
  ctx.fillStyle = night;
  ctx.fillRect(win.x, win.y, win.w, win.h);
  for (let i = 0; i < 6; i++) {
    const lx = win.x + win.w * (0.1 + i * 0.16), ly = win.y + win.h * (0.75 + 0.05 * Math.sin(i * 2.3));
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 30);
    g.addColorStop(0, 'rgba(255,190,120,0.18)'); g.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - 30, ly - 30, 60, 60);
  }

  // rain on the glass
  ctx.save();
  ctx.beginPath(); ctx.rect(win.x, win.y, win.w, win.h); ctx.clip();
  for (const st of streaks) {
    ctx.strokeStyle = `rgba(180,200,230,${st.a})`;
    ctx.lineWidth = st.w;
    ctx.beginPath(); ctx.moveTo(st.x, st.y0); ctx.lineTo(st.x, st.y1); ctx.stroke();
    st.a *= 0.985;
  }
  streaks = streaks.filter(st => st.a > 0.01);
  for (const d of drops) {
    if (d.stick > 0) d.stick--; else {
      d.v = Math.min(d.v + 0.04 * d.r, 3 * d.r);
      const y0 = d.y; d.y += d.v; d.x += Math.sin(d.y * 0.05) * 0.3;
      if (d.v > 1) streaks.push({ x: d.x, y0, y1: d.y, w: d.r * 0.6, a: 0.18 });
    }
    ctx.fillStyle = 'rgba(200,215,240,0.35)';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    if (d.y > win.y + win.h + 5) Object.assign(d, newDrop(), { y: win.y - 5 });
  }
  if (Math.random() < 0.3) drops.push(Object.assign(newDrop(), { stick: 0, r: Math.random() * 0.8 + 0.5 }));
  if (drops.length > 140) drops.splice(0, drops.length - 140);
  ctx.restore();

  // window frame
  ctx.strokeStyle = '#2a1c12'; ctx.lineWidth = 10;
  ctx.strokeRect(win.x, win.y, win.w, win.h);
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(win.x + win.w / 2, win.y); ctx.lineTo(win.x + win.w / 2, win.y + win.h);
  ctx.moveTo(win.x, win.y + win.h / 2); ctx.lineTo(win.x + win.w, win.y + win.h / 2);
  ctx.stroke();

  // lamp glow
  const R = Math.max(W, H) * 0.55 * breathe * flicker;
  const glow = ctx.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, R);
  glow.addColorStop(0, `rgba(255,200,130,${0.42 * breathe})`);
  glow.addColorStop(0.25, `rgba(255,160,80,${0.16 * breathe})`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // dust motes, only visible in the light
  for (const m of motes) {
    m.x += m.vx + Math.sin(s * 0.3 + m.p) * 0.05; m.y += m.vy;
    if (m.y < -5) m.y = H + 5; if (m.x < -5) m.x = W + 5; if (m.x > W + 5) m.x = -5;
    const dist = Math.hypot(m.x - lamp.x, m.y - lamp.y);
    const a = Math.max(0, 1 - dist / (R * 0.6)) * (0.5 + 0.5 * Math.sin(s + m.p));
    if (a < 0.02) continue;
    ctx.fillStyle = `rgba(255,225,180,${a * 0.8})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
  }

  // the bulb
  const bulb = ctx.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, 14);
  bulb.addColorStop(0, 'rgba(255,245,220,0.95)'); bulb.addColorStop(1, 'rgba(255,200,130,0)');
  ctx.fillStyle = bulb; ctx.beginPath(); ctx.arc(lamp.x, lamp.y, 14, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
