<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation — Anya</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:#111; color:#eee; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; overflow:hidden; }
    .bar { position:fixed; left:0; right:0; display:flex; align-items:center; gap:14px; padding:12px 20px; z-index:2; transition:opacity .3s; }
    .top { top:0; background:linear-gradient(#111d, #1110); }
    .bottom { bottom:0; justify-content:center; background:linear-gradient(#1110, #111d); }
    .bar a, .bar button { color:#eee; text-decoration:none; font:inherit; font-size:.92rem; background:none; border:1px solid #fff3; border-radius:999px; padding:5px 14px; cursor:pointer; }
    .bar a:hover, .bar button:hover { border-color:#fff9; }
    .bar button:disabled { opacity:.3; cursor:default; }
    #title { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #count { font-variant-numeric:tabular-nums; min-width:70px; text-align:center; font-size:.92rem; }
    #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    canvas { box-shadow:0 10px 40px #0008; background:#fff; }
    #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#aaa; }
    body.idle .bar { opacity:0; }
    body.idle { cursor:none; }
  </style>
</head>
<body>
  <div class="bar top">
    <a href="index.html#presentations">&larr; Back</a>
    <span id="title"></span>
    <a id="download" download>Download PDF</a>
    <button id="fs" title="Fullscreen (F)">Fullscreen</button>
  </div>
  <div id="stage"><canvas id="slide"></canvas></div>
  <div id="status">Loading…</div>
  <div class="bar bottom">
    <button id="prev" title="Previous (←)">&larr;</button>
    <span id="count"></span>
    <button id="next" title="Next (→)">&rarr;</button>
  </div>

  <script>
    for (const f of ["data.js", "site.js"]) document.write(`<script src="${f}?v=${Date.now()}"><\/script>`);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const $ = id => document.getElementById(id);
    const deck = presentations.find(d => d.id === new URLSearchParams(location.search).get("deck"));
    let pdf = null, page = 1, rendering = null;

    async function show(n) {
      if (!pdf) return;
      page = Math.max(1, Math.min(pdf.numPages, n));
      history.replaceState(null, "", `?deck=${encodeURIComponent(deck.id)}#${page}`);
      $("count").textContent = `${page} / ${pdf.numPages}`;
      $("prev").disabled = page === 1;
      $("next").disabled = page === pdf.numPages;
      const p = await pdf.getPage(page);
      const base = p.getViewport({ scale: 1 });
      const fit = Math.min(innerWidth * 0.94 / base.width, innerHeight * 0.86 / base.height);
      const dpr = devicePixelRatio || 1;
      const vp = p.getViewport({ scale: fit * dpr });
      const c = $("slide");
      c.width = vp.width; c.height = vp.height;
      c.style.width = `${vp.width / dpr}px`; c.style.height = `${vp.height / dpr}px`;
      if (rendering) rendering.cancel();
      rendering = p.render({ canvasContext: c.getContext("2d"), viewport: vp });
      try { await rendering.promise; } catch (e) {}
    }

    if (!deck) {
      $("status").textContent = "Presentation not found.";
    } else {
      document.title = `${deck.title} — Anya`;
      $("title").textContent = deck.title;
      $("download").href = deck.file;
      pdfjsLib.getDocument(deck.file).promise.then(doc => {
        pdf = doc;
        $("status").remove();
        show(parseInt(location.hash.slice(1)) || 1);
      }).catch(() => { $("status").textContent = "Couldn't load the slides."; });
    }

    $("prev").onclick = () => show(page - 1);
    $("next").onclick = () => show(page + 1);
    $("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    $("stage").onclick = e => show(e.clientX < innerWidth / 3 ? page - 1 : page + 1);
    addEventListener("keydown", e => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(page + 1); }
      else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); show(page - 1); }
      else if (e.key === "Home") show(1);
      else if (e.key === "End" && pdf) show(pdf.numPages);
      else if (e.key === "f" || e.key === "F") $("fs").click();
    });
    let x0 = null;
    addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
    addEventListener("touchend", e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) show(dx < 0 ? page + 1 : page - 1);
    });
    let resizeT;
    addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => show(page), 150); });
    let idleT;
    addEventListener("mousemove", () => {
      document.body.classList.remove("idle");
      clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2500);
    });
  </script>
</body>
</html>
