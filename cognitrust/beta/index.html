<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CogniTrust beta sign-up</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #000; font: 18px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 20px 48px; }
  .kicker { font-weight: 800; letter-spacing: .16em; text-transform: uppercase; font-size: 13px; border-top: 6px solid #000; padding-top: 8px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 34px; line-height: 1.1; margin: 14px 0 10px; }
  p { margin: 0 0 20px; }
  label { display: block; font-weight: 800; margin: 18px 0 6px; }
  .hint { font-weight: 400; font-size: 15px; }
  input, textarea { width: 100%; font: inherit; padding: 12px; border: 2px solid #000; border-radius: 6px; background: #fff; color: #000; }
  textarea { min-height: 130px; resize: vertical; }
  input:focus, textarea:focus { outline: 3px solid #000; outline-offset: 2px; }
  button { margin-top: 22px; width: 100%; font: inherit; font-weight: 800; padding: 14px; border: 0; border-radius: 6px; background: #000; color: #fff; cursor: pointer; }
  .small { font-size: 14px; margin-top: 18px; }
  .done { display: none; border: 3px solid #000; padding: 16px; border-radius: 6px; }
  footer { margin-top: 32px; padding-top: 10px; border-top: 6px solid #000; font-family: Georgia, serif; font-style: italic; }
</style>
</head>
<body>
<main>
  <div class="kicker">CogniTrust · Beta</div>
  <h1>Help us test CogniTrust.</h1>
  <p id="intro">Leave your email and when you're usually free. We'll reach out with next steps.</p>

  <div class="done" id="thanks"><b>Thank you!</b> You're on the list. We'll email you soon.</div>

  <form id="f" action="https://formsubmit.co/decarloanya758@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="New CogniTrust beta sign-up">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_next" id="next">

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">

    <label for="availability">Availability <span class="hint">(days, times, time zone, anything we should know)</span></label>
    <textarea id="availability" name="availability" placeholder="e.g. Weekday evenings after 6pm, or Saturday mornings"></textarea>

    <button type="submit">Sign me up</button>
    <p class="small">We only use your email to contact you about the beta.</p>
  </form>

  <footer>Accurate dementia research is the mission. That means everyone.</footer>
</main>
<script>
  document.getElementById("next").value = location.href.split(/[?#]/)[0] + "?thanks=1";
  if (/thanks=1/.test(location.search)) {
    document.getElementById("f").style.display = "none";
    document.getElementById("intro").style.display = "none";
    document.getElementById("thanks").style.display = "block";
  }
</script>
</body>
</html>
