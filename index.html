<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anya — Portfolio</title>
  <meta name="description" content="Selected work by Anya.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Anya</h1>
      <p>Selected projects, tools, and interactive pieces.</p>
      <nav>
        <a href="#work">Work</a>
        <a href="#analysis-tools">Analysis Tools</a>
        <a href="#creative">Creative</a>
        <a href="#education">Education</a>
        <a href="#projects">Projects</a>
        <a href="https://github.com/anya-decarlo">GitHub</a>
      </nav>
    </header>

    <h2 id="work">Work</h2>
    <div class="filters" id="work-filters"></div>
    <p class="count" id="work-count"></p>
    <div class="grid" id="work-grid"></div>

    <h2 id="analysis-tools">Analysis Tools</h2>
    <div class="filters" id="tools-filters"></div>
    <p class="count" id="tools-count"></p>
    <div class="grid" id="tools-grid"></div>

    <h2 id="creative">Creative</h2>
    <div class="grid" id="creative-grid"></div>

    <h2 id="education">Education</h2>
    <div class="grid" id="education-grid"></div>

    <h2 id="projects">Projects</h2>
    <div class="grid" id="projects-grid"></div>

    <footer>&copy; <span id="year"></span> Anya</footer>
  </div>

  <script>
    for (const f of ["data.js", "site.js"]) document.write(`<script src="${f}?v=${Date.now()}"><\/script>`);
  </script>
  <script>
    renderFiltered("work", work);
    renderFiltered("tools", analysisTools);
    renderSimple("creative-grid", creative);
    renderSimple("education-grid", education);
    renderProjects();
  </script>
</body>
</html>
